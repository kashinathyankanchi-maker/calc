name: kashi
description: A GitHub-themed Flutter Calculator with GitHub Profile Stats integration and timber logs CBM calculator.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  http: ^1.1.0
  math_expressions: ^2.4.0
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  google_mlkit_text_recognition: ^0.11.0
  pdf: ^3.10.7
  printing: ^5.12.0
  excel: ^4.0.2
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  flutter_tesseract_ocr: ^0.4.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.jpg
    - assets/tessdata/
    - assets/tessdata_config.json

flutter_launcher_icons:
  android: "kashi"
  ios: false
  image_path: "assets/icon/app_icon.jpg"
