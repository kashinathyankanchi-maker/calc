name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Download Kannada + English tessdata (fast variant, ~6MB total)
        run: |
          mkdir -p assets/tessdata
          echo "Downloading Kannada tessdata..."
          curl -L "https://github.com/tesseract-ocr/tessdata_fast/raw/main/kan.traineddata" \
               -o assets/tessdata/kan.traineddata
          echo "Downloading English tessdata..."
          curl -L "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" \
               -o assets/tessdata/eng.traineddata
          echo "Done:"
          ls -lh assets/tessdata/

      - name: Recreate Android platform configuration
        run: flutter create --platforms=android .

      - name: Force minSdkVersion to 23 in build.gradle
        run: sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle

      - name: Set app label to kashi in AndroidManifest.xml
        run: sed -i 's/android:label="[^"]*"/android:label="kashi"/g' android/app/src/main/AndroidManifest.xml

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build split APKs (one per CPU architecture)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kashi-android-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
